# Pulls latest posts into _data/medium_latest.json and _data/salesforce_blog_latest.json (RSS, no API keys).
#
# Manual run: Actions → "Update latest blog previews" → Run workflow.
name: Update latest blog previews

on:
  schedule:
    - cron: "20 15 * * *" # daily, offset from the X workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-blog-previews
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch blog RSS feeds
        run: |
          python3 script/fetch-latest-medium-post.py
          python3 script/fetch-latest-salesforce-blog-post.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/medium_latest.json _data/salesforce_blog_latest.json
          if git diff --staged --quiet; then
            echo "No changes to blog preview JSON"
          else
            git commit -m "chore: refresh latest blog previews [skip ci]"
            git push
          fi
